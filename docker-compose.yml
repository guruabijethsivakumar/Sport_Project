services:
  # ── Express TypeScript API Backend ─────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: playmatch-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - playmatch-net

  # ── React Vite Single Page App (Nginx) ────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_FEATURE_RECOMMENDATIONS_MODE: live
        VITE_FEATURE_TEAMS_MODE: live
        VITE_FEATURE_RESULTS_MODE: live
        VITE_FEATURE_NOTIFICATIONS_MODE: live
        VITE_FEATURE_RELIABILITY_MODE: live
    container_name: playmatch-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - playmatch-net

  # ── Optional Local MongoDB Replica Set (for offline dev without Atlas) ─────
  mongo:
    image: mongo:${MONGO_IMAGE_TAG:-7.0}
    container_name: ${MONGO_CONTAINER_NAME:-playmatch-mongo}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-playmatch}
    entrypoint:
      - bash
      - -c
      - |
        /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all
    volumes:
      - playmatch-mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            rs.status();
            quit(0);
          } catch (e) {
            try {
              rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] });
              quit(0);
            } catch (err) {
              quit(1);
            }
          }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      - playmatch-net

networks:
  playmatch-net:
    driver: bridge

volumes:
  playmatch-mongo-data:
    name: ${MONGO_VOLUME_NAME:-playmatch-mongo-data}
